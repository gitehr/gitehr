# The three checks every contributor runs locally (s/lint + s/test) and that
# must pass before merge: formatting, clippy as errors, and the test suite.
#
# Clinical calculations are supplied through the external `gitehr-clincalc`
# plugin, so GitEHR has no calculator dependency in its release pipeline.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable, with rustfmt and clippy)
        # Plain rustup, no third-party action: GitHub runners ship rustup,
        # and the runner's rustup version never affects which Rust the code
        # compiles with. This removes the recurring dtolnay/rust-toolchain
        # pin-rot problem (version branches are force-pushed at every Rust
        # release; the action's mutable v1 tag kept tripping zizmor's
        # ref-version-mismatch audit) - there is no third-party action
        # left to pin.
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: zizmor@1.29.0
          fallback: none
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}

  gui-e2e:
    name: GUI e2e (Webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        # See the note on the first toolchain step: plain rustup, no
        # third-party action.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/e2e/package-lock.json

      - name: Install WebKit runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install GUI Node dependencies
        working-directory: gui
        run: npm ci

      - name: Install e2e Node dependencies
        working-directory: gui/e2e
        run: npm ci

      - name: Provide CI git identity for test-store commits
        run: |
          git config --global user.name "GitEHR CI"
          git config --global user.email "ci@gitehr.invalid"
          git config --global commit.gpgsign false

      - name: Run GUI e2e tests
        working-directory: gui/e2e
        run: xvfb-run -a npm test
