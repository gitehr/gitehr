version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      routine-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/gui"
      - "/gui/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      routine-minor-and-patch:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # The Rust crates in gui/src-tauri are =-pinned (tauri 2.10.1,
    # tauri-plugin-dialog 2.6.0, tauri-plugin-opener 2.5.3); tauri-cli's
    # version-mismatch check fails if the npm side moves ahead of them
    # (see tauri-cli's check and the e2e CI history). Ignore these until
    # the Rust side deliberately moves to the next minor line.
    ignore:
      - dependency-name: "@tauri-apps/api"
      - dependency-name: "@tauri-apps/plugin-dialog"
      - dependency-name: "@tauri-apps/plugin-opener"
      - dependency-name: "@tauri-apps/cli"
