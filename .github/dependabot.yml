version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      routine-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/gui"
      - "/gui/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    # One combined PR for everything this npm entry manages (/gui and
    # /gui/e2e). Note: `group-by: dependency-name` must NOT be used
    # here - despite the name it splits updates into one PR PER dependency
    # across directories, which is what produced four separate @wdio PRs
    # (#159-#162). Plain `patterns` grouping combines all matched
    # dependencies into a single PR per run. Majors are a separate group so
    # they still arrive in one PR but visibly as major bumps.
    groups:
      routine-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      routine-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    # The Rust crates in gui/src-tauri are =-pinned (tauri 2.10.1,
    # tauri-plugin-dialog 2.6.0, tauri-plugin-opener 2.5.3); tauri-cli's
    # version-mismatch check fails if the npm side moves ahead of them
    # (see tauri-cli's check and the e2e CI history). Ignore these until
    # the Rust side deliberately moves to the next minor line.
    ignore:
      - dependency-name: "@tauri-apps/api"
      - dependency-name: "@tauri-apps/plugin-dialog"
      - dependency-name: "@tauri-apps/plugin-opener"
      - dependency-name: "@tauri-apps/cli"
